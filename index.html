<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<meta name="description" content="WATCH — A minimal clock that tells you time on a 16x2 LCD.">

<meta property="og:title" content="WATCH">
<meta property="og:description" content="A minimal clock that tells you time on a 16x2 LCD.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://github.com/user-attachments/assets/5a5d3524-e198-4764-b864-bd661f93616c">

<title>WATCH • Minimal LCD Clock</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' fill='black'/%3E%3Ctext x='64' y='78' text-anchor='middle' font-family='Arial,Helvetica,sans-serif' font-size='44' font-weight='700' fill='white'%3Et:me%3C/text%3E%3C/svg%3E">
    
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,sans-serif;
    color:#fff;
    overflow-x:hidden;
    position:relative;
}

/* ---------------- Background Video ---------------- */

#bg-video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
}

/* Dark Overlay */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(4px);
    z-index:-2;
}

/* ---------------- Main Container ---------------- */

.container{
    position:relative;
    z-index:1;
    max-width:1100px;
    margin:auto;
    padding:50px 30px;
}

/* ---------------- Heading ---------------- */

h1{
    text-align:center;
    font-size:3.5rem;
    letter-spacing:8px;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#cfcfcf;
    margin-bottom:60px;
}

/* ---------------- Video Cards ---------------- */

.video-box{
    margin-bottom:70px;
}

.video-link{
    display:block;
    color:inherit;
    text-decoration:none;
}

video.preview{
    display:block;
    width:100%;
    max-height:700px;
    object-fit:contain;
    background:#000;
    border-radius:18px;
    border:1px solid rgba(255,255,255,.15);
    box-shadow:0 15px 40px rgba(0,0,0,.45);
}

.version{
    text-align:center;
    margin-top:18px;
    color:#ddd;
    font-size:1.05rem;
    letter-spacing:1px;
}

/* ---------------- Footer ---------------- */

footer{
    position:relative;
    z-index:1;
    margin-top:80px;
    padding:30px;
    text-align:center;
    background:rgba(0,0,0,.25);
    backdrop-filter:blur(8px);
    border-top:1px solid rgba(255,255,255,.15);
}

footer a{
    color:#fff;
    text-decoration:none;
    font-weight:600;
    transition:.25s;
}

footer a:hover{
    color:#63d5ff;
}

footer p{
    margin-top:12px;
    color:#bbb;
    font-size:.95rem;
}

@media (max-width:768px){

    .container{
        padding:30px 15px;
    }

    h1{
        font-size:2.4rem;
        letter-spacing:5px;
    }

    video.preview{
        max-height:400px;
    }

}

/* ---------------- LCD Results ---------------- */

.lcd-section{
    margin:70px 0;
}

.lcd-section h2{
    text-align:center;
    margin-bottom:30px;
    font-size:2rem;
    letter-spacing:2px;
}

.lcd-gallery{
    display:flex;
    justify-content:center;
    gap:25px;
    flex-wrap:wrap;
}

.lcd-gallery img{
    width:calc(50% - 12.5px);
    max-width:500px;
    border-radius:18px;
    border:1px solid rgba(255,255,255,.15);
    box-shadow:0 15px 40px rgba(0,0,0,.45);
    object-fit:cover;
}

@media (max-width:768px){

    .lcd-gallery img{
        width:100%;
    }

}
</style>

</head>

<body>

<!-- Animated Background -->

<video id="bg-video" autoplay muted loop playsinline>
    <source src="assests/bg.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="container">

    <h1>WATCH</h1>
    <p class="subtitle">A minimal Clock that tells you time on 16x2 LCD</p>

    <!-- Version 1 -->

    <a class="video-link" href="https://github.com/S2Sofficial/watch/tree/main/v1" target="_blank" rel="noopener noreferrer">
        <div class="video-box">

            <video class="preview" autoplay muted loop playsinline>
                
                <source src="v1/version1.mp4" type="video/mp4">
            </video>

            <div class="version">
                Version 1
            </div>

        </div>
    </a>

    <!-- Version 2 -->

    <a class="video-link" href="https://github.com/S2Sofficial/watch/tree/main/v2" target="_blank" rel="noopener noreferrer">
        <div class="video-box">

            <video class="preview" autoplay muted loop playsinline>
                <source src="v2/version2.mp4" type="video/mp4">
            </video>

            <div class="version">
                Version 2
            </div>

        </div>
    </a>

    <!-- Version 3 -->

    <a class="video-link" href="https://github.com/S2Sofficial/watch/tree/main/v3" target="_blank" rel="noopener noreferrer">
        <div class="video-box">

            <video class="preview" autoplay muted loop playsinline>
                <source src="v3/version3.mp4" type="video/mp4">
            </video>

            <div class="version">
                Version 3
            </div>

        </div>
    </a>

    <!-- LCD Results -->

<div class="lcd-section">

    <h2>LCD Output</h2>

    <div class="lcd-gallery">

        <img src="https://github.com/user-attachments/assets/cf7a77dc-0153-4384-8d9d-f25d191a89c9" alt="LCD Result 1">
        <img src="https://github.com/user-attachments/assets/4e9a8282-e7e5-49fd-b04d-29c2351a91fd" alt="LCD Result 2">

    </div>

</div>

</div>

<footer>

    <a href="https://github.com/s2sofficial/watch" target="_blank">
        Available on GitHub
    </a>

    <p>Built by Swaroop Kumar Yadav & Claude • <span id="year"></span></p>

    <script>
    document.getElementById("year").textContent=new Date().getFullYear();
    </script>

</footer>

</body>
</html>
